services:
  - type: web
    name: omnitools-ultimate
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: IMGBB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

